<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7CC3EE"/>
      <stop offset=".55" stop-color="#2D6FAE"/>
      <stop offset="1" stop-color="#143A66"/>
    </linearGradient>
    <filter id="b60" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="b30" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="b14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="b6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <radialGradient id="glassFill" cx="35%" cy="25%" r="85%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".45" stop-color="#d9efff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#a6d4f2" stop-opacity=".30"/>
    </radialGradient>
    <linearGradient id="rim" x1=".15" y1=".05" x2=".85" y2=".95">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".25"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".1"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".7"/>
    </linearGradient>
    <linearGradient id="pinFill" x1=".2" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#FF8F7F"/>
      <stop offset=".55" stop-color="#F0513F"/>
      <stop offset="1" stop-color="#C7362A"/>
    </linearGradient>
    <linearGradient id="pinRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".55"/>
    </linearGradient>
    <radialGradient id="core" cx="38%" cy="32%" r="70%">
      <stop offset="0" stop-color="#FFF4C2"/>
      <stop offset=".45" stop-color="#FFD24D"/>
      <stop offset="1" stop-color="#F2A516"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="512" cy="600" r="300"/></clipPath>
    <clipPath id="pinClip"><path d="M512 618C472 530 368 466 368 346a144 144 0 0 1 288 0C656 466 552 530 512 618z"/></clipPath>
  </defs>

  <!-- full-bleed luminous backdrop with soft colour fields -->
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="200" cy="180" r="260" fill="#B8F0FF" opacity=".45" filter="url(#b60)"/>
  <circle cx="880" cy="860" r="300" fill="#3B2F9E" opacity=".45" filter="url(#b60)"/>
  <circle cx="860" cy="240" r="180" fill="#FFD27A" opacity=".25" filter="url(#b60)"/>

  <!-- globe: a glass sphere with frosted land behind it -->
  <circle cx="512" cy="640" r="300" fill="#0A2240" opacity=".45" filter="url(#b30)"/>
  <g clip-path="url(#globe)">
    <circle cx="512" cy="600" r="300" fill="#5AA7DA" opacity=".55"/>
    <g fill="#FFF8E8" opacity=".85" filter="url(#b6)">
      <path d="M262 452c56-56 160-66 216-28 38 24 28 76-10 94-46 24-38 76-84 90-56 18-112-10-140-56-24-42-10-72 18-100z"/>
      <path d="M594 404c66-28 160 0 196 56 28 44 10 94-38 104-56 12-74 66-130 66-52 0-84-46-66-94 16-38-18-104 38-132z"/>
      <path d="M424 730c38-28 104-18 132 18 28 38 10 104-38 132-38 22-84 4-104-34-16-34-22-90 10-116z"/>
      <path d="M706 702c32-14 66 6 70 38 4 32-28 56-58 48-34-8-46-72-12-86z"/>
    </g>
    <g fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="5">
      <ellipse cx="512" cy="600" rx="124" ry="300"/>
      <ellipse cx="512" cy="600" rx="236" ry="300"/>
      <path d="M512 300v600M212 600h600M232 488c170 38 390 38 560 0M232 712c170-38 390-38 560 0"/>
    </g>
    <circle cx="512" cy="600" r="300" fill="url(#glassFill)"/>
    <!-- specular sweep, top-left -->
    <path d="M290 470c40-110 150-170 250-168-120 30-190 90-230 190z" fill="#fff" opacity=".75" filter="url(#b14)"/>
    <!-- light caught on the lower inner edge -->
    <path d="M330 830c90 70 260 80 370-20-110 60-260 60-370 20z" fill="#fff" opacity=".45" filter="url(#b6)"/>
  </g>
  <circle cx="512" cy="600" r="298" fill="none" stroke="url(#rim)" stroke-width="7"/>

  <!-- pin: tinted glass with a glossy core -->
  <ellipse cx="512" cy="628" rx="78" ry="22" fill="#0A2240" opacity=".45" filter="url(#b14)"/>
  <path d="M512 640C472 552 368 488 368 368a144 144 0 0 1 288 0C656 488 552 552 512 640z" fill="#5A1410" opacity=".35" filter="url(#b30)" transform="translate(0 6)"/>
  <path d="M512 618C472 530 368 466 368 346a144 144 0 0 1 288 0C656 466 552 530 512 618z" fill="url(#pinFill)" opacity=".94"/>
  <g clip-path="url(#pinClip)">
    <path d="M392 330c10-90 80-140 150-140-70 30-120 80-130 160z" fill="#fff" opacity=".8" filter="url(#b14)"/>
    <ellipse cx="560" cy="520" rx="70" ry="30" fill="#fff" opacity=".18" filter="url(#b14)"/>
  </g>
  <path d="M512 618C472 530 368 466 368 346a144 144 0 0 1 288 0C656 466 552 530 512 618z" fill="none" stroke="url(#pinRim)" stroke-width="5"/>
  <circle cx="512" cy="346" r="64" fill="#7A1F14" opacity=".35" filter="url(#b6)" transform="translate(0 6)"/>
  <circle cx="512" cy="346" r="62" fill="url(#core)"/>
  <ellipse cx="492" cy="322" rx="26" ry="16" fill="#fff" opacity=".85" filter="url(#b3)"/>
  <circle cx="512" cy="346" r="61" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="3"/>
</svg>
